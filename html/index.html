<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login SAAS</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <div id="container">
        <div id="imagem">
            <img src="../imgs/Group 24.png" alt="Imagem de médico com uma prancheta em frente a um paciente">
        </div>

        <div id="background-branco">
            <div id="logo-conta-formulario">
                <div id="logo-texto-sigla">
                    <div id="logo">
                        <img src="../imgs/healthcare 1.png"
                            alt="Logo da Sistema de Agendamento de Atendimento em Saúde ">
                    </div>
                    <div id="texto">
                        Sistema de Agendamento de Atendimento em Saúde
                    </div>
                    <div id="sigla">
                        SAAS
                    </div>
                </div>

                <div id="acesse-sua-conta">
                    <h3>Acesse sua conta</h3>
                </div>
                <div id="formulario">
                    <form action="#" method="post">
                        <fieldset>
                            <label for="email-user">E-mail</label>
                            <input type="email" name="" id="email-user" placeholder="Seu e-mail" required>
                            <label for="password-user">Senha</label>
                            <input type="password" name="" id="password-user" placeholder="Sua senha" required>
                            <a href="#">Esqueci minha senha</a>
                            <button type="button">Entrar</button>
                        </fieldset>
                    </form>
                </div>
            </div>
            <span id="cadastre-se">
                <hr>
                <p>Não tem uma conta? <a href="#">Cadastrar-se</a></p>
            </span>
        </div>
    </div>

</body>

</html>
